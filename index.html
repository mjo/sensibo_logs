<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Data</title>
    <!-- Major versions only: minor and patch updates are picked up automatically, a breaking major release is not -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 1.5em;
            text-align: center;
        }

        label, input, button {
            margin: 10px 0;
            width: 90%;
            max-width: 400px;
        }

        .chart-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 200px;
        }

        @media (max-width: 600px) and (orientation: portrait) {
            h1 {
                font-size: 1.2em;
            }

            label, input, button {
                width: 100%;
                font-size: 1em;
            }

            .chart-container {
                width: 100%;
                height: 300px; /* Increase height for portrait mode */
            }
        }
    </style>
</head>
<body>
    <h1>Temperature Data</h1>
    <label for="startDate">Select Start Date:</label>
    <input type="date" id="startDate" name="startDate" onchange="updateChart(currentView)">
    <button onclick="updateChart('daily')">Daily View</button>
    <button onclick="updateChart('weekly')">Weekly View</button>
    <div class="chart-container">
        <canvas id="temperatureChart"></canvas>
    </div>
    <script>
        let chart;
        let allData;
        let currentView = 'daily';

        fetch('log.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                console.log('Fetched data:', data); // Debugging log
                allData = data;
                document.getElementById('startDate').value = getCurrentDate(); // Set default date to current date
                updateChart('daily'); // Default view
            })
            .catch(error => console.error('Error fetching the JSON data:', error));

        // Log timestamps are "YYYY-MM-DD HH:MM:SS" local time; the ISO form with "T" parses in all browsers
        function parseTimestamp(timestamp) {
            return new Date(timestamp.replace(' ', 'T'));
        }

        function getCurrentDate() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0!
            const yyyy = today.getFullYear();

            return `${yyyy}-${mm}-${dd}`;
        }

        const currentDate = getCurrentDate();
        console.log('Current Date:', currentDate); // Debugging log

        function updateChart(view) {
            currentView = view;
            const now = new Date();
            const startDateInput = document.getElementById('startDate');
            let startDate = new Date(startDateInput.value + 'T00:00'); // Local midnight
            if (isNaN(startDate)) {
                startDate = now;
            }
            let filteredData;
            let rangeStart;
            let rangeEnd;

            if (view === 'daily') {
                const nextDay = new Date(startDate);
                nextDay.setDate(startDate.getDate() + 1);
                rangeStart = startDate;
                rangeEnd = nextDay;
                filteredData = allData.filter(entry => {
                    const entryDate = parseTimestamp(entry.timestamp);
                    return entryDate >= startDate && entryDate < nextDay;
                });
            } else if (view === 'weekly') {
                const nextDay = new Date(startDate);
                nextDay.setDate(startDate.getDate() + 1);
                const oneWeekAgo = new Date(startDate);
                oneWeekAgo.setDate(startDate.getDate() - 6);
                rangeStart = oneWeekAgo;
                rangeEnd = nextDay;
                filteredData = allData.filter(entry => {
                    const entryDate = parseTimestamp(entry.timestamp);
                    return entryDate >= oneWeekAgo && entryDate < nextDay;
                });
            }

            const timestamps = filteredData.map(entry => parseTimestamp(entry.timestamp));
            const indoorTemps = filteredData.map(entry => entry.indoor_temp);
            const outdoorTemps = filteredData.map(entry => entry.outdoor_temp);
            // The heat pump target after the run: the target sent to Sensibo, or the unchanged previous target if nothing was sent
            const indoorTargetTemps = filteredData.map(entry => entry.json_data?.acState?.targetTemperature ?? entry.indoor_prev_target_temp);
            const indoorWantedTemps = filteredData.map(entry => entry.indoor_wanted_temp);

            console.log('Timestamps:', timestamps); // Debugging log
            console.log('Indoor Temps:', indoorTemps); // Debugging log
            console.log('Outdoor Temps:', outdoorTemps); // Debugging log
            console.log('Indoor Target Temps:', indoorTargetTemps); // Debugging log
            console.log('Indoor Wanted Temps:', indoorWantedTemps); // Debugging log

            const ctx = document.getElementById('temperatureChart').getContext('2d');
            if (chart) {
                chart.destroy();
            }
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: [
                        {
                            label: 'Indoor Temperature (°C)',
                            data: indoorTemps,
                            borderColor: 'rgba(255, 0, 0, 1)', // Red
                            borderWidth: 1,
                            fill: false,
                            spanGaps: true
                        },
                        {
                            label: 'Outdoor Temperature (°C)',
                            data: outdoorTemps,
                            borderColor: 'rgba(0, 0, 255, 1)', // Blue
                            borderWidth: 1,
                            fill: false,
                            spanGaps: true
                        },
                        {
                            label: 'Heat Pump Target Temperature (°C)',
                            data: indoorTargetTemps,
                            borderColor: 'rgba(199, 21, 133, 1)', // Magenta, light pink was hard to see on white
                            borderWidth: 1,
                            fill: false,
                            spanGaps: true
                        },
                        {
                            label: 'Indoor Wanted Temperature (°C)',
                            data: indoorWantedTemps,
                            borderColor: 'rgba(255, 165, 0, 1)', // Orange
                            borderWidth: 1,
                            fill: false,
                            spanGaps: true
                        }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            min: rangeStart,
                            max: rangeEnd,
                            time: {
                                unit: view === 'daily' ? 'hour' : 'day',
                                tooltipFormat: 'HH:mm', // 24-hour format for tooltips
                                displayFormats: {
                                    hour: 'HH:mm',
                                    day: 'MMM dd'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        },
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
